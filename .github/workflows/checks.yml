name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -q
      - name: Validate web assets
        run: |
          node --check web/dist/app.js
          node --check web/dist/i18n.js
          python -m json.tool web/dist/openapi.json >/dev/null
          python scripts/localize_openapi.py --check
          python scripts/check_docs.py
      - name: Build container
        run: docker build -t krisha-list:test .
